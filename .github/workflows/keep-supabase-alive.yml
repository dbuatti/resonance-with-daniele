name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 12 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase Auth Settings
        run: |
          echo "=== Auth Settings ==="
          curl -s --connect-timeout 10 \
            "https://xefifvztgeiuvzibiltj.supabase.co/auth/v1/settings"
          echo ""

      - name: Query Supabase REST API (profiles count)
        run: |
          echo "=== Profiles Count ==="
          curl -s --connect-timeout 10 \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhlZmlmdnp0Z2VpdXZ6aWJpbHRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg1MjAyODYsImV4cCI6MjA3NDA5NjI4Nn0.6Rf2x9grV98lueMvS_t2pHCo_TDom3RknEsYzNWWpOU" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhlZmlmdnp0Z2VpdXZ6aWJpbHRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg1MjAyODYsImV4cCI6MjA3NDA5NjI4Nn0.6Rf2x9grV98lueMvS_t2pHCo_TDom3RknEsYzNWWpOU" \
            -H "Content-Type: application/json" \
            -H "Prefer: count=exact" \
            "https://xefifvztgeiuvzibiltj.supabase.co/rest/v1/profiles?select=id&limit=1"
          echo ""

      - name: Query Supabase REST API (events count)
        run: |
          echo "=== Events Count ==="
          curl -s --connect-timeout 10 \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhlZmlmdnp0Z2VpdXZ6aWJpbHRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg1MjAyODYsImV4cCI6MjA3NDA5NjI4Nn0.6Rf2x9grV98lueMvS_t2pHCo_TDom3RknEsYzNWWpOU" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhlZmlmdnp0Z2VpdXZ6aWJpbHRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg1MjAyODYsImV4cCI6MjA3NDA5NjI4Nn0.6Rf2x9grV98lueMvS_t2pHCo_TDom3RknEsYzNWWpOU" \
            -H "Content-Type: application/json" \
            -H "Prefer: count=exact" \
            "https://xefifvztgeiuvzibiltj.supabase.co/rest/v1/events?select=id&limit=1"
          echo ""

      - name: Query Supabase REST API (announcements count)
        run: |
          echo "=== Announcements Count ==="
          curl -s --connect-timeout 10 \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhlZmlmdnp0Z2VpdXZ6aWJpbHRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg1MjAyODYsImV4cCI6MjA3NDA5NjI4Nn0.6Rf2x9grV98lueMvS_t2pHCo_TDom3RknEsYzNWWpOU" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhlZmlmdnp0Z2VpdXZ6aWJpbHRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg1MjAyODYsImV4cCI6MjA3NDA5NjI4Nn0.6Rf2x9grV98lueMvS_t2pHCo_TDom3RknEsYzNWWpOU" \
            -H "Content-Type: application/json" \
            -H "Prefer: count=exact" \
            "https://xefifvztgeiuvzibiltj.supabase.co/rest/v1/announcements?select=id&limit=1"
          echo ""
