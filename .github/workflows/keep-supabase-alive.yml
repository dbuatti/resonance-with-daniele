name: Keep Supabase Alive

# Supabase pauses free-plan projects that see no activity for 7 days.
# This workflow is the external heartbeat for that window.
#
# Two jobs:
#   1. ping     - hits the project's REST/Auth/Storage APIs and asserts HTTP 200.
#   2. heartbeat - commits a timestamp to the repo, because GitHub auto-disables
#                  scheduled workflows after 60 days of *repository* inactivity.
#                  Workflow runs alone do NOT count as repo activity, so without
#                  this commit the workflow silently dies (that's what happened
#                  on 2026-10-16 and let the project drift to a 7-day pause).

on:
  schedule:
    # Daily at 06:17 UTC (off-peak minute; GitHub cron is UTC-only).
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-supabase-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve credentials
        id: creds
        env:
          SB_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SB_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          # The secrets were saved with surrounding quotes/whitespace, which
          # breaks the Authorization header. Strip them.
          clean() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"; }
          url="$(clean "${SB_URL:-}")"
          key="$(clean "${SB_KEY:-}")"
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::Missing Supabase credentials in repo secrets."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "Resolved project: $url (key length: ${#key})"

      - name: Ping Auth
        env:
          SB_URL: ${{ steps.creds.outputs.url }}
          SB_KEY: ${{ steps.creds.outputs.key }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/auth.json -w "%{http_code}" --connect-timeout 15 --max-time 30 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
            "$SB_URL/auth/v1/settings")
          echo "Auth settings HTTP $code"
          cat /tmp/auth.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::Auth ping failed with HTTP $code"
            exit 1
          fi

      - name: Ping REST
        env:
          SB_URL: ${{ steps.creds.outputs.url }}
          SB_KEY: ${{ steps.creds.outputs.key }}
        run: |
          set -euo pipefail
          for table in profiles events announcements; do
            code=$(curl -s -o /tmp/rest.json -w "%{http_code}" --connect-timeout 15 --max-time 30 \
              --retry 3 --retry-delay 5 --retry-all-errors \
              -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
              -H "Content-Type: application/json" \
              "$SB_URL/rest/v1/$table?select=id&limit=1")
            echo "REST $table -> HTTP $code"
            if [ "$code" != "200" ]; then
              cat /tmp/rest.json; echo
              echo "::error::REST ping on $table failed with HTTP $code"
              exit 1
            fi
          done

      - name: Ping Storage
        env:
          SB_URL: ${{ steps.creds.outputs.url }}
          SB_KEY: ${{ steps.creds.outputs.key }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/storage.json -w "%{http_code}" --connect-timeout 15 --max-time 30 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
            "$SB_URL/storage/v1/bucket")
          echo "Storage buckets -> HTTP $code"
          if [ "$code" != "200" ]; then
            cat /tmp/storage.json; echo
            echo "::warning::Storage ping failed with HTTP $code (non-fatal)"
          fi

      - name: Summary
        run: |
          {
            echo "### Supabase heartbeat OK"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Auth | 200 |"
            echo "| REST | 200 |"
            echo "| Storage | 200 |"
          } >> "$GITHUB_STEP_SUMMARY"

  heartbeat:
    name: Reset repo inactivity timer
    # Runs weekly. Commits at most every ~20 days, which keeps the repository
    # well inside GitHub's 60-day inactivity window, so this workflow can never
    # be auto-disabled again.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit heartbeat if stale
        run: |
          set -euo pipefail
          MARKER=".keepalive/last-ping"
          # Age of the most recent commit of any kind. Real development activity
          # already keeps the repository active, so no heartbeat commit is made
          # while the project is being worked on.
          LAST=$(git log -1 --format=%ct 2>/dev/null || echo 0)
          NOW=$(date +%s)
          AGE_DAYS=$(( (NOW - LAST) / 86400 ))
          echo "Most recent commit: ${AGE_DAYS} days ago"
          if [ "$AGE_DAYS" -lt 20 ]; then
            echo "Repository is active; no heartbeat commit needed."
            exit 0
          fi
          mkdir -p .keepalive
          echo "last_heartbeat_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$MARKER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MARKER"
          git commit -m "chore: supabase keepalive heartbeat $(date -u +%Y-%m-%d)"
          git push origin HEAD:${{ github.ref_name }}
          echo "Heartbeat committed."
