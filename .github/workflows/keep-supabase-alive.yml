name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check DNS resolution
        run: |
          host xefifvztgeiuvzibiltj.supabase.co
          nslookup xefifvztgeiuvzibiltj.supabase.co
      - name: Ping Supabase project
        run: |
          curl -v --connect-timeout 10 \
            "https://xefifvztgeiuvzibiltj.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" 2>&1
